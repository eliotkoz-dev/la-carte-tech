# Modèle de fiche · copiez ce fichier, renommez-le (ex. fiches/mon-entreprise.yml)
# puis remplissez chaque champ. Les fichiers qui commencent par « _ » sont ignorés.

nom: Nom de l’entreprise
categorie: saas          # cloud | ia | puces | data | saas | cyber | pub | ecommerce | fintech | crypto | espace
region: europe           # amerique-du-nord | europe | asie
# aussi: [ia]             # facultatif : 1 ou 2 autres catégories où elle est active ; sa bulle se place entre les zones
groupe: Cotée à Paris    # ou « Non cotée », « Groupe X »…
siege: Paris (France)
en_bref: Ce qu’elle fait, en moins de 6 mots
chiffre_affaires:
  texte: "1,2 Md€ en 2025 (+15 %)"   # affiché en gros sur la fiche ; « Non publié » si besoin
  md_usd: 1.4                        # en milliards de dollars, pour la taille de la bulle (0 si non publié)
chiffres_cles:
  - "Nombre de clients, de salariés, part de marché… avec l’année"
ce_qu_elle_vend: "Une phrase simple : quel produit, pour quoi faire."
produits:
  - nom: Produit 1
    detail: ce qu’il fait, en quelques mots
modele: "Comment elle gagne de l’argent : abonnement, commission, publicité…"
clients: "PME, grands groupes…"
rachats:
  - "Nom (année) : ce que ça apporte"   # ou « Aucun rachat listé »
concurrents: "Concurrent 1, Concurrent 2"
# note: "Facultatif : une info utile (investisseurs, partenariats…)"
# vente:                    # facultatif : comment elle vend (voir CONTRIBUTING.md)
#   approche: mixte         # libre-service | vente-directe | mixte | partenaires
#   resume: "Comment elle trouve et signe ses clients, en une ou deux phrases."
#   acheteurs: "Qui décide de l’achat chez le client"
#   argument: "Ce qu’elle met en avant face aux concurrents"
#   objections:
#     - "Une objection fréquente d’un client"
#   sources:                # obligatoire dès qu’il y a un chiffre
#     - titre: "…"
#       url: "https://…"
# carrieres: "https://…"          # facultatif : page carrières officielle
# carrieres_jeunes: "https://…"    # facultatif : page stages / jeunes diplômés
stages:
  statut: a-verifier     # oui | alternance | programme | a-verifier
  detail: "À vérifier sur le site carrières de l’entreprise."
