ce_qu_elle_vend: "Une plateforme où l’on partage, teste et déploie des modèles d’IA, surtout open source, avec des offres payantes pour les entreprises."
produits:
- nom: Hub
  detail: bibliothèque de modèles et de jeux de données
- nom: Spaces
  detail: démos d’applications d’IA
- nom: Inference Endpoints
  detail: faire tourner un modèle dans le cloud
- nom: Enterprise Hub
  detail: la plateforme avec sécurité et contrôle pour les entreprises
modele: "Gratuit pour la plupart des usages ; abonnements Pro, Team et Enterprise (par utilisateur), et paiement à l’usage pour la puissance de calcul."
clients: développeurs, chercheurs, entreprises
rachats:
- Aucun rachat listé
concurrents: "GitHub, les plateformes d’IA des clouds (Amazon Bedrock, Vertex AI)"
note: "Sa levée de 2023 (235 M$) a été menée par Salesforce, avec Google, Amazon, Nvidia, Intel, IBM, Qualcomm et AMD. Nvidia a annoncé son rachat pour 12,9 Md$ en septembre 2026 (pas encore finalisé)."
vente:
  approche: mixte
  resume: "Les développeurs l’utilisent gratuitement, puis les entreprises passent aux offres payantes en ligne ou avec une équipe commerciale."
  acheteurs: "Les équipes IA et data, et le DSI pour l’offre Enterprise"
  argument: "Le lieu central de l’IA open source : les modèles sont déjà là, et les développeurs aussi"
  objections:
  - "Pourquoi payer alors que l’essentiel est gratuit"
  - "Les plateformes d’IA des clouds font une partie du même travail"
