- nom: S3
  detail: stockage de fichiers en ligne
- nom: RDS et DynamoDB
  detail: bases de données gérées
- nom: Amazon Bedrock
  detail: "accès aux modèles d’IA, dont Claude"
- nom: Trainium
  detail: puces maison pour entraîner l’IA
modele: "Paiement à l’usage (à l’heure, au gigaoctet, à la requête), avec des remises contre un engagement sur plusieurs années pour les grands comptes."
clients: "startups, PME, grands groupes, secteur public"
rachats:
- "Annapurna Labs (2015) : conception de puces"
concurrents: "Microsoft Azure, Google Cloud"
note: Principal partenaire cloud d’Anthropic ; contrat de 38 Md$ avec OpenAI (nov. 2025).
vente:
  approche: mixte
  resume: "N’importe qui ouvre un compte en ligne avec une carte bancaire ; pour les grands comptes, des commerciaux et des architectes techniques négocient des engagements sur plusieurs années. Beaucoup de ventes passent aussi par des intégrateurs et la place de marché AWS."
  acheteurs: "Le DSI ou le directeur technique, les équipes de développeurs, et les achats pour les gros engagements"
  argument: "Le catalogue de services le plus large et le plus ancien du marché"
  objections:
  - "La facture est difficile à prévoir et peut grimper vite"
  - "La peur d’être enfermé chez un seul fournisseur"
  - "La souveraineté des données pour les clients européens"
