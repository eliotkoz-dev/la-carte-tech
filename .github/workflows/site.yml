name: Vérifier et publier le site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Chaque lundi : le build recalcule les stages « à vérifier » (relevés de plus de 6 mois) et republie le site.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Vérifier la mise en forme du code
        run: npm run format:check
      - name: Vérifier les fiches et construire les données
        run: npm run build
      - name: Ajouter un numéro de version aux fichiers CSS et JS (évite que les navigateurs gardent l’ancienne version)
        run: sed -i -E "s#(assets/[a-z]+\.(css|js))\"#\1?v=${GITHUB_SHA::7}\"#g" site/*.html
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
